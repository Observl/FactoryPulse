name: MVP validation
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm run test:client
      - run: node scripts/test-operational-tasks.mjs
      - run: node scripts/test-device-state.mjs
      - run: node scripts/test-device-sort.mjs
      - run: node scripts/test-runtime-mode.mjs
  backend:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.lock.txt
      - run: python -m pytest -q
      - run: python scripts/final-acceptance.py
        env:
          FACTORYPULSE_DATA_DIR: ${{ runner.temp }}/factorypulse-ci
