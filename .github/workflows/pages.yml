name: Publish FactoryPulse Web Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript and Vite build
        run: npm run build > build.log 2>&1 || { cat build.log; exit 1; }
        env:
          VITE_STATIC_DEMO: 'true'
      - name: Post compiler diagnostics to development issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -f build.log; then
            { echo '### GitHub Pages 编译诊断'; echo '```'; tail -c 12000 build.log; echo '```'; } > diagnostic.md
            gh issue comment 1 --body-file diagnostic.md
          fi
      - name: Confirm static build exists
        run: test -s dist/index.html && test -d dist/assets
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking Pages configuration..."
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > pages-type.txt 2> pages-error.txt; then
            cat pages-error.txt
            echo "::error::GitHub Pages is not enabled or cannot be accessed. Open Settings > Pages > Build and deployment, select GitHub Actions as source and save."
            exit 1
          fi
          echo "Pages build type: $(cat pages-type.txt)"
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
