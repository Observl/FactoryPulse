name: Publish FactoryPulse Web Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        run: npm run build > build.log 2>&1 || { cat build.log; exit 1; }
        env:
          VITE_STATIC_DEMO: 'true'
      - name: Post compiler diagnostics to development issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -f build.log; then
            { echo '### GitHub Pages 编译诊断'; echo '```'; tail -c 12000 build.log; echo '```'; } > diagnostic.md
            gh issue comment 1 --body-file diagnostic.md
          fi
      - name: Confirm static build exists
        run: test -s dist/index.html && test -d dist/assets
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record Pages deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1 --body 'Pages 部署步骤失败：请检查仓库 Settings → Pages → Build and deployment → Source 是否为 GitHub Actions，以及 Actions 中 deploy 任务的具体报错。前端构建已通过。'
